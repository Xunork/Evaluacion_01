<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ferretería El Tornillo Fuerte</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="login-screen" class="screen active">
        <div class="login-card">
          <div class="brand">
            <span class="brand-icon">🔧</span>
            <h1>Ferretería El Tornillo Fuerte</h1>
          </div>

          <div class="role-selection">
            <button id="admin-login-btn" class="role-btn active" type="button">Entrar como administrador</button>
            <button id="client-view-btn" class="role-btn" type="button">Ver catálogo</button>
          </div>

          <form id="login-form">
            <label for="password">Contraseña del administrador</label>
            <input id="password" type="password" placeholder="Ingrese la contraseña" required />

            <button type="submit" class="primary-btn">Ingresar</button>
          </form>

          <p class="hint">Contraseña admin: admin123</p>
        </div>
      </div>

      <div id="dashboard-screen" class="screen">
        <header class="topbar">
          <div>
            <p class="eyebrow">Catálogo online</p>
            <h2>Ferretería El Tornillo Fuerte</h2>
          </div>
          <div class="topbar-actions">
            <span id="user-badge" class="badge">Cliente</span>
            <button id="logout-btn" class="secondary-btn">Cerrar sesión</button>
          </div>
        </header>

        <nav class="nav">
          <button id="catalog-tab" class="nav-btn active">Productos</button>
          <button id="admin-tab" class="nav-btn hidden-admin">Administración</button>
        </nav>

        <main>
          <section id="catalog-section" class="panel active">
            <div class="summary-row">
              <div class="summary-card">
                <span>Total</span>
                <strong id="summary-total">0</strong>
              </div>
              <div class="summary-card">
                <span>Disponibles</span>
                <strong id="summary-available">0</strong>
              </div>
              <div class="summary-card">
                <span>Sin stock</span>
                <strong id="summary-empty">0</strong>
              </div>
            </div>
            <div id="product-list" class="product-grid"></div>
          </section>

          <section id="admin-section" class="panel">
            <div class="admin-layout">
              <form id="product-form" class="product-form">
                <h3>Agregar o editar producto</h3>
                <input id="product-id" type="hidden" />

                <label for="name">Nombre</label>
                <input id="name" type="text" placeholder="Ej: Taladro Bosch" required />

                <label for="category">Categoría</label>
                <input id="category" type="text" placeholder="Ej: Herramienta" required />

                <label for="price">Precio</label>
                <input id="price" type="number" min="0" step="0.01" placeholder="15000" required />

                <label for="stock">Stock</label>
                <input id="stock" type="number" min="0" placeholder="20" required />

                <label for="description">Descripción</label>
                <textarea id="description" rows="3" placeholder="Descripción del producto" required></textarea>

                <div class="form-actions">
                  <button type="submit" class="primary-btn">Guardar producto</button>
                  <button type="button" id="reset-form" class="secondary-btn">Limpiar</button>
                </div>
              </form>

              <div class="admin-list">
                <h3>Inventario actual</h3>
                <div id="admin-product-list" class="admin-grid"></div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
